<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document Encoding & Responsive Viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta Description for SEO -->
    <meta name="description" content="Calculate simple interest quickly and accurately with our free Interest Rate Calculator app.">
    <title>Interest Rate Calculator - Simple & Accurate</title>

    <!-- App Favicon & Stylesheet Links -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Calculator UI Container -->
    <main>
        <h1>Interest Rate Calculator</h1>
        
        <!-- Input Form Fields -->
        <form id="calculator-form">
            <label for="principal">Principal Amount ($):</label>
            <input type="number" id="principal" name="principal" required>

            <label for="rate">Annual Interest Rate (%):</label>
            <input type="number" id="rate" name="rate" step="0.1" required>

            <label for="years">Time Period (Years):</label>
            <input type="number" id="years" name="years" required>

            <button type="button" id="calculate-btn">Calculate Interest</button>
        </form>

        <!-- Calculation Results Display -->
        <div id="result"></div>
    </main>

    <!-- Webpack Bundled Application Output -->
    <script src="dist/main.js"></script>
</body>
</html>
